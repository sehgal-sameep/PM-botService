syntax = "proto3";

// Live contract for the ML Agent's `ChatAgent.AskPolicyManager` RPC — server-to-server,
// gRPC transport. A 3-file contract: this file, policy_manager/v1/policy_manager.proto and
// orchestrator/v1/common.proto. The latter two are Thoughtful Labs' finalized files, copied
// verbatim from ../../../../docs (keep them byte-identical; edit only this file). This file adds
// what their README leaves to us: the `AskPolicyManager` rpc and the
// `policy_manager_answer_payload` arm of `AnswerPayload`. Generated Java sources land under
// target/generated-sources/protobuf. GrpcMlAgentClient maps this backend's MlAgentRequest into
// AskPolicyManagerRequest; AnswerEvents are not mapped at all — they are forwarded to the
// frontend verbatim (see com.pmbotservice.sse.SseEvents).

// NOTE: the proto package is part of the wire contract (the gRPC method path is
// /cmbotservice.mlagent.v1.ChatAgent/AskPolicyManager) and must match the ML Agent's — the same
// package as the shared Case Manager contract and the two Thoughtful Labs files.
package cmbotservice.mlagent.v1;

import "orchestrator/v1/common.proto";
import "policy_manager/v1/policy_manager.proto";

option java_package = "com.cmbotservice.mlagent.grpc.v1";
option java_multiple_files = true;

// The ML Agent's ChatAgent service also serves
//   rpc AskCaseManager(AskCaseManagerRequest) returns (stream AnswerEvent);
// for the Case Manager chatbot. A gRPC client only needs the methods it calls, so that RPC
// and its Case Manager types are deliberately not declared in this Policy Manager backend.
service ChatAgent {
  // Sends a single policy manager chat request to the ML Agent and streams response events
  // back to the caller.
  rpc AskPolicyManager(AskPolicyManagerRequest) returns (stream AnswerEvent);
}

// Events arrive in the order they should be rendered.
// Consecutive `chunk` events form one text block.
// Any other event closes the current block and forms its own block.
// Note: `payload` may arrive at any point in the stream, not only at the end.
// Clients MUST ignore events whose `event` oneof is unset or unrecognised
// and continue reading the stream.
message AnswerEvent {
  oneof event {
    // Incremental text generated by the ML Agent.
    Chunk chunk = 1;

    // Indicates that the ML Agent invoked a tool.
    ToolCall tool_call = 2;

    // Result of a tool invocation.
    ToolResult tool_result = 3;

    // Structured response needing rendered UI components produced by the ML Agent.
    AnswerPayload payload = 4;

    // Terminal. The response is valid; see Done.
    Done done = 5;

    // Terminal. No usable response; see Error.
    Error error = 6;

    // Keepalive from the ML Agent to the caller.
    Ping ping = 7;
  }
}

// Union of every module's structured payload. One arm per module.
// Lives here, not in common.proto, because it must import every module file.
message AnswerPayload {
  // `CaseManagerAnswerPayload case_manager_answer_payload = 1` — the Case Manager arm of the
  // shared contract. Not declared here (see the note on ChatAgent), but its number stays taken.
  reserved 1;
  reserved "case_manager_answer_payload";

  oneof payload {
    // The payload for a Policy Manager structured answer response needing UI component rendering.
    PolicyManagerAnswerPayload policy_manager_answer_payload = 2;
  }
}
